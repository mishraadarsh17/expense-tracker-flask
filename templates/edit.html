{%extends "layout.html"%}
{%block content%}

<h1 class="fw-bold ">Edit Your Expense</h1>
<hr class="border border-primary border-3 opacity-75">
<div class="p-4">

    <form method="post">


        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header">
                        <h3>Edit Expense</h3>
                    </div>

                    <div class="card-body">

                        <form method="POST">

                            <div class="mb-3">
                                <label>Title</label>
                                <input type="text" name="title" class="form-control" value="{{ expense[1] }}">
                            </div>

                            <div class="mb-3">
                                <label>Amount</label>
                                <input type="text" name="amount" class="form-control" value="{{ expense[2] }}">
                            </div>

                            <div class="mb-3">
                                <label>Category</label>

                                <select name="category" class="form-control">

                                    {% for c in categories %}
                                    <option value="{{ c }}" {% if c==expense[3] %}selected{% endif %}>
                                        {{ c }}
                                    </option>
                                    {% endfor %}

                                </select>
                            </div>

                            <button class="btn btn-dark w-100">
                                Update Expense
                            </button>
                            <a href="/" class="btn btn-dark w-100 mt-2">Cancel</a>
                        </form>

                    </div>

                </div>

            </div>

        </div>


    </form>

</div>


{%endblock%}
