{% extends "layout.html"%}
{% block content%}
<h1 class="fw-bold ">Update Profile</h1>
<hr class="border border-primary border-3 opacity-75 mb-4" >

<form action="/edit_profile" method="post" enctype="multipart/form-data"
    style="line-height: 1.6;margin: 40px auto;max-width: 800px;padding: 0 20px;">
    <h2 class="fw-bold mb-3">Profile Details</h2>



    <div class="row mb-3 ">
        <label class="col-sm-2 col-form-label">Profile Photo</label>
        <div class="col-sm-10">
            {% if user_detl[4] %}
            <div class="d-flex gap-2">
                <a href="/remove_photo" class="form-control  text-decoration-none text-danger">Update / Remove</a>
            </div>
            {% else %}
            <input type="file" name="profile_photo" class="form-control">
            {% endif %}
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Name</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" name="name" value="{{user_detl[0]}}">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-10">
            <input type="email" class="form-control" name="email" value="{{user_detl[1]}}">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">D-O-B</label>
        <div class="col-sm-10">
            <input type="date" class="form-control" name="dob" value="{{user_detl[2]}}">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Contact</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" name="contact" value="{{user_detl[3]}}">
        </div>
    </div>

    <button type="submit" class="btn btn-dark px-4 py-2">Update</button>
</form>
{%endblock%}
